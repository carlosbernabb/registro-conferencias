<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin de asistencia</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: block; padding: 16px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .login { max-width: 380px; margin: 12vh auto 0; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; margin-bottom: 18px; }
  header h1 { font-size: 24px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm { margin: 0; font-size: 14px; padding: 9px 14px; border-radius: 10px; }
  .btn-ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .conf {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 16px; cursor: pointer; text-align: left; color: var(--text); font: inherit;
  }
  .conf.sel { border-color: var(--accent); }
  .conf h2 { margin: 0; font-size: 17px; }
  .num { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .num small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .detail { margin-top: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .detail-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .detail-head h2 { margin: 0; font-size: 20px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  td.num-cell { font-variant-numeric: tabular-nums; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--warn); font-weight: 600; }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
  .updated { color: var(--muted); font-size: 13px; }
  /* Proyección del QR */
  .qr-overlay {
    position: fixed; inset: 0; background: #fff; color: #111; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; text-align: center;
  }
  .qr-overlay h2 { margin: 0; font-size: clamp(24px, 5vw, 48px); }
  .qr-overlay p { margin: 0; font-size: clamp(16px, 2.5vw, 26px); color: #444; }
  #qr-box { background: #fff; padding: 16px; }
  #qr-box img, #qr-box canvas { width: min(70vh, 82vw) !important; height: auto !important; image-rendering: pixelated; }
  .qr-overlay .close { position: absolute; top: 16px; right: 16px; }
  .qr-overlay a { color: #444; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <section class="card login" id="login">
    <p class="eyebrow">Panel de organizador</p>
    <h1>Asistencia a conferencias</h1>
    <form id="login-form">
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <p class="error" id="login-error" hidden>Contraseña incorrecta.</p>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <section id="panel" hidden>
    <header>
      <div>
        <p class="eyebrow">Panel de organizador</p>
        <h1>Asistencia en tiempo real</h1>
        <span class="updated" id="updated"></span>
      </div>
      <div class="actions">
        <button class="btn-sm btn-ghost" id="refresh">Actualizar</button>
        <button class="btn-sm" id="csv-all">Descargar todo (Excel/CSV)</button>
      </div>
    </header>
    <div class="grid" id="grid"></div>
    <div class="detail" id="detail"></div>
  </section>
</div>

<div class="qr-overlay" id="qr-overlay" hidden>
  <button class="btn-sm btn-ghost close" id="qr-close" style="color:#111;border-color:#ccc">Cerrar</button>
  <h2 id="qr-title"></h2>
  <p>Escanea para registrar tu asistencia</p>
  <div id="qr-box"></div>
  <a id="qr-link" target="_blank" rel="noopener"></a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const BASE = location.href.replace(/admin\.html.*$/, "");
let password = "";
let data = [];
let selected = null;
let timer = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
const linkFor = (c) => `${BASE}?c=${c.id}&t=${c.token}`;

async function load() {
  const r = await rpc("conf_admin_datos", { p_password: password });
  if (!r) return false;
  data = r;
  if (!selected && data.length) selected = data[0].id;
  render();
  $("updated").textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX");
  return true;
}

function render() {
  $("grid").innerHTML = data.map((c) => {
    const n = c.asistencias.length;
    const pct = c.preinscritos ? Math.min(100, Math.round((c.asistencias.filter(a => a.preinscrito).length / c.preinscritos) * 100)) : 0;
    return `<button class="conf ${c.id === selected ? "sel" : ""}" data-id="${c.id}">
      <h2>${esc(c.titulo)}</h2>
      <div class="num">${n} <small>registrados · ${c.preinscritos} preinscritos</small></div>
      <div class="bar"><span style="width:${pct}%"></span></div>
    </button>`;
  }).join("");

  const c = data.find((x) => x.id === selected);
  if (!c) { $("detail").innerHTML = ""; return; }
  const extra = c.asistencias.filter((a) => !a.preinscrito).length;
  const rows = c.asistencias.map((a, i) => `<tr>
      <td class="num-cell">${i + 1}</td>
      <td class="num-cell">${fmtTime(a.registrado_en)}</td>
      <td class="num-cell">${esc(a.matricula)}</td>
      <td>${esc(a.nombre)} ${a.preinscrito ? "" : '<span class="tag">No preinscrito</span>'}</td>
      <td>${esc(a.correo)}</td>
      <td>${esc(a.materia)}</td>
      <td>${esc(a.semestre)}</td>
    </tr>`).join("");
  $("detail").innerHTML = `
    <div class="detail-head">
      <div>
        <h2>${esc(c.titulo)}</h2>
        <span class="updated">${c.asistencias.length} registrados · ${extra} sin preinscripción</span>
      </div>
      <div class="actions">
        <button class="btn-sm" data-qr="${c.id}">Proyectar QR</button>
        <button class="btn-sm btn-ghost" data-copy="${c.id}">Copiar link</button>
        <button class="btn-sm btn-ghost" data-csv="${c.id}">Descargar CSV</button>
      </div>
    </div>
    <div class="table-wrap">
      ${rows ? `<table><thead><tr><th>#</th><th>Hora</th><th>ID</th><th>Nombre</th><th>Correo</th><th>Materia</th><th>Sem.</th></tr></thead><tbody>${rows}</tbody></table>`
             : `<p class="empty">Todavía no hay registros en esta conferencia.</p>`}
    </div>`;
}

function csv(confs) {
  const head = ["Conferencia", "Hora de registro", "ID", "Nombre", "Preinscrito", "Correo", "Materia", "Semestre"];
  const lines = [head];
  for (const c of confs) for (const a of c.asistencias) {
    lines.push([c.titulo, new Date(a.registrado_en).toLocaleString("es-MX"), a.matricula, a.nombre, a.preinscrito ? "Sí" : "No", a.correo || "", a.materia || "", a.semestre || ""]);
  }
  const text = lines.map((l) => l.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = confs.length === 1 ? `asistencia-${confs[0].id}.csv` : "asistencia-conferencias.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

function showQR(c) {
  $("qr-title").textContent = c.titulo;
  $("qr-box").innerHTML = "";
  new QRCode($("qr-box"), { text: linkFor(c), width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
  $("qr-link").href = linkFor(c);
  $("qr-link").textContent = linkFor(c);
  $("qr-overlay").hidden = false;
  document.documentElement.requestFullscreen?.().catch(() => {});
}

document.addEventListener("click", async (e) => {
  const card = e.target.closest(".conf");
  if (card) { selected = card.dataset.id; render(); return; }
  const t = e.target;
  const find = (id) => data.find((c) => c.id === id);
  if (t.dataset.qr) showQR(find(t.dataset.qr));
  if (t.dataset.csv) csv([find(t.dataset.csv)]);
  if (t.dataset.copy) {
    try { await navigator.clipboard.writeText(linkFor(find(t.dataset.copy))); t.textContent = "¡Copiado!"; }
    catch { prompt("Copia el link:", linkFor(find(t.dataset.copy))); }
  }
});
$("qr-close").onclick = () => { $("qr-overlay").hidden = true; document.fullscreenElement && document.exitFullscreen(); };
$("refresh").onclick = () => load();
$("csv-all").onclick = () => csv(data);

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  password = $("pass").value;
  $("login-error").hidden = true;
  let ok = false;
  try { ok = await load(); } catch { $("login-error").textContent = "Sin conexión."; }
  if (!ok) { $("login-error").hidden = false; return; }
  try { sessionStorage.setItem("conf-admin", password); } catch {}
  $("login").hidden = true;
  $("panel").hidden = false;
  clearInterval(timer);
  timer = setInterval(() => load().catch(() => {}), 15000);
});

try {
  const saved = sessionStorage.getItem("conf-admin");
  if (saved) { $("pass").value = saved; $("login-form").requestSubmit(); }
} catch {}
</script>
</body>
</html>
