<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Registro de asistencia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="card" id="app">
  <div class="loading" id="loading"><span class="spinner"></span> Verificando QR…</div>

  <!-- Formulario -->
  <section id="form-view" hidden>
    <p class="eyebrow">Registro de asistencia</p>
    <h1 id="conf-titulo">Conferencia</h1>
    <p class="muted" id="conf-hora"></p>

    <form id="form" autocomplete="off" novalidate>
      <label for="matricula">ID / Matrícula</label>
      <input id="matricula" name="matricula" inputmode="numeric" placeholder="Ej. 00549401" maxlength="12" required>

      <div id="nombre-wrap" hidden>
        <p class="note">Tu ID no aparece en la lista de preinscritos de esta conferencia. Escribe tu nombre completo para registrarte.</p>
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" autocomplete="name" maxlength="120" placeholder="Nombre y apellidos">
      </div>

      <p class="error" id="error" role="alert" hidden></p>
      <button type="submit" id="btn">Registrar asistencia</button>
    </form>
  </section>

  <!-- Resultado -->
  <section id="result-view" class="result" hidden>
    <div class="icon" id="result-icon">✓</div>
    <h1 id="result-title">¡Bienvenido(a)!</h1>
    <p class="big" id="result-name"></p>
    <p class="muted" id="result-detail"></p>
  </section>
</main>

<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const conf = params.get("c") || "";
const token = params.get("t") || "";
const lockKey = `conf-registro-${conf}`;

function show(view) {
  $("loading").hidden = true;
  $("form-view").hidden = view !== "form";
  $("result-view").hidden = view !== "result";
}

function result(kind, title, name, detail) {
  const icon = $("result-icon");
  icon.className = "icon " + kind;
  icon.textContent = kind === "ok" ? "✓" : kind === "warn" ? "!" : "✕";
  $("result-title").textContent = title;
  $("result-name").textContent = name || "";
  $("result-detail").textContent = detail || "";
  show("result");
}

function readLock() {
  try { return JSON.parse(localStorage.getItem(lockKey)); } catch { return null; }
}
function writeLock(data) {
  try { localStorage.setItem(lockKey, JSON.stringify(data)); } catch {}
}

let confInfo = null;

async function init() {
  if (!conf || !token) return result("bad", "QR no válido", "", "Escanea el código QR que se muestra en la conferencia.");
  try {
    confInfo = await rpc("conf_info", { p_conf: conf, p_token: token });
  } catch {
    return result("bad", "Sin conexión", "", "Revisa tu internet y vuelve a escanear el QR.");
  }
  if (!confInfo) return result("bad", "QR no válido", "", "Este código no corresponde a ninguna conferencia.");
  if (!confInfo.activa) return result("warn", "Registro cerrado", "", `El registro de la ${confInfo.titulo} ya no está disponible.`);

  const lock = readLock();
  if (lock) return result("ok", "Ya registraste tu asistencia", lock.nombre, `${confInfo.titulo} · registrado a las ${lock.hora}`);

  $("conf-titulo").textContent = confInfo.titulo;
  $("conf-hora").textContent = "Escribe tu ID para confirmar tu asistencia.";
  show("form");
  $("matricula").focus();
}

function err(msg) {
  $("error").textContent = msg;
  $("error").hidden = !msg;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  err("");
  const matricula = $("matricula").value.trim();
  const needsName = !$("nombre-wrap").hidden;
  const nombre = $("nombre").value.trim();
  if (!/\d/.test(matricula)) return err("Escribe tu ID o matrícula (solo números).");
  if (needsName && nombre.split(/\s+/).length < 2) return err("Escribe tu nombre completo (nombre y apellido).");

  const btn = $("btn");
  btn.disabled = true;
  btn.textContent = "Registrando…";
  let r;
  try {
    r = await rpc("conf_registrar", { p_conf: conf, p_token: token, p_matricula: matricula, p_nombre: needsName ? nombre : null });
  } catch {
    btn.disabled = false;
    btn.textContent = "Registrar asistencia";
    return err("No se pudo conectar. Revisa tu internet e intenta de nuevo.");
  }
  btn.disabled = false;
  btn.textContent = "Registrar asistencia";

  const now = new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
  switch (r.status) {
    case "ok":
      writeLock({ nombre: r.nombre, hora: now });
      return result("ok", "¡Bienvenido(a)! Registro exitoso", r.nombre, confInfo.titulo);
    case "ya_registrado":
      writeLock({ nombre: r.nombre, hora: r.hora });
      return result("ok", "Ya estabas registrado(a)", r.nombre, `${confInfo.titulo} · registrado a las ${r.hora}`);
    case "necesita_nombre":
      $("nombre-wrap").hidden = false;
      $("matricula").readOnly = true;
      $("nombre").focus();
      return;
    case "id_invalido":
      return err("El ID o el nombre no son válidos. Revísalos e intenta de nuevo.");
    case "cerrada":
      return result("warn", "Registro cerrado", "", `El registro de la ${confInfo.titulo} ya no está disponible.`);
    default:
      return result("bad", "QR no válido", "", "Este código no corresponde a ninguna conferencia.");
  }
});

init();
</script>
</body>
</html>
